version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']
# Cargo source replacement is unsupported by Dependabot. See docs/CI.md.
# Weekly crates.io inventory remains enabled in cargo-versions.yml.
