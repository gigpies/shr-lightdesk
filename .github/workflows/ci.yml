name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 1
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        cargo_args: ['', '--features native']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libx11-dev libxkbcommon-dev libvulkan1 mesa-vulkan-drivers
      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustc +1.97.1 -vV
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Formatting
        run: |
          cargo +1.97.1 fmt --all -- --check
      - name: Locked check
        run: |
          cargo +1.97.1 check --locked --all-targets ${{ matrix.cargo_args }}
      - name: Normal offline tests
        run: |
          unset DISPLAY WAYLAND_DISPLAY VK_DRIVER_FILES VK_ICD_FILENAMES VK_ADD_DRIVER_FILES
          cargo +1.97.1 test --locked --all-targets ${{ matrix.cargo_args }} -- --test-threads=1
      - name: CPU-only Vulkan upload and readback
        if: matrix.cargo_args == '--features native'
        run: |
          unset DISPLAY WAYLAND_DISPLAY VK_DRIVER_FILES VK_ADD_DRIVER_FILES
          if [ ! -e /usr/share/vulkan/icd.d/lvp_icd.json ]; then
            icd="/usr/share/vulkan/icd.d/lvp_icd.$(uname -m).json"
            test -f "$icd"
            sudo ln -s "$icd" /usr/share/vulkan/icd.d/lvp_icd.json
          fi
          export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/lightdesk-runtime"
          install -d -m 0700 "$XDG_RUNTIME_DIR"
          cargo +1.97.1 test --locked --features native --lib native::tests::software_wgpu_upload_shader_readback -- --ignored --exact --nocapture
      - name: Publication boundary and guard regressions
        run: |
          python3 scripts/check_publication.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Clippy and release build
        run: |
          cargo +1.97.1 clippy --locked --all-targets ${{ matrix.cargo_args }} -- -D warnings
          cargo +1.97.1 build --locked --release ${{ matrix.cargo_args }}
  automation:
    uses: gigpies/.github/.github/workflows/quality.yml@80d76c2b710d90e55f4f95ecea192c514f471fe6
  gate:
    name: Required CI
    if: ${{ always() }}
    needs: [check, automation]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all build and contributor checks
        env:
          BUILD_RESULT: ${{ needs.check.result }}
          AUTOMATION_RESULT: ${{ needs.automation.result }}
        run: test "$BUILD_RESULT" = success && test "$AUTOMATION_RESULT" = success
